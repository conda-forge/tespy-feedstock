schema_version: 1

context:
  name: tespy
  version: "0.11.2"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/tespy-${{ version }}.tar.gz
  sha256: 3113f10e1f2cd1b2f8e7b5197ebfd20a54baedd4ce09e3d3a1127d124e8fdcad

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - flit-core >=3.2,<4
    - pip
  run:
    - fluprodia >=4.1.2
    - pint
    - scipy
    - python >=${{ python_min }}
    - coolprop >=6.8
    - jinja2
    - matplotlib-base >=3.2.1
    - numpy >=1.13.3
    - pandas >=1.3.0
    - tabulate >=0.8.2

tests:
  - python:
      imports:
        - tespy
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Thermal Engineering Systems in Python (TESPy)
  description: |
    Thermal Engineering Systems in Python (TESPy). This package
    provides a powerful simulation toolkit for thermal engineering plants
    such as power plants, district heating systems or heat pumps.
  homepage: https://oemof.org/libraries/#tespy
  repository: https://github.com/oemof/tespy
  documentation: http://tespy.readthedocs.io/en/master/

extra:
  recipe-maintainers:
    - jan-janssen
